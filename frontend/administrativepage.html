<section class="summary">
    <div class="card">
        <h3>Total Complaints</h3>
        <div class="number" id="total">0</div>
    </div>

    <div class="card">
        <h3>Pending Complaints</h3>
        <div class="number" id="pending">0</div>
    </div>

    <div class="card">
        <h3>Resolved Complaints</h3>
        <div class="number" id="resolved">0</div>
    </div>
</section>

<div class="table-container">
    <h2>Reported Issues</h2>

    <p class="notice" id="notice">Loading complaints...</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Location</th>
                <th>Description</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="complaintTable"></tbody>
    </table>
</div>
```

</main>

<script>
    async function loadComplaints() {
        const notice = document.getElementById("notice");
        const table = document.getElementById("complaintTable");

        try {
            const response = await fetch("/api/complaints");

            if (!response.ok) {
                throw new Error("Unable to load complaints.");
            }

            const complaints = await response.json();

            table.replaceChildren();

            let pending = 0;
            let resolved = 0;

            for (const complaint of complaints) {
                if (complaint.status === "Resolved") {
                    resolved++;
                } else {
                    pending++;
                }

                const row = document.createElement("tr");

                const values = [
                    complaint.id,
                    complaint.title,
                    complaint.location,
                    complaint.description,
                    complaint.created_at,
                    complaint.status
                ];

                for (const value of values) {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);
                }

                table.appendChild(row);
            }

            document.getElementById("total").textContent = complaints.length;
            document.getElementById("pending").textContent = pending;
            document.getElementById("resolved").textContent = resolved;

            notice.textContent = complaints.length
                ? "Complaint list updated."
                : "No complaints have been submitted yet.";

        } catch (error) {
            notice.textContent = "Could not load complaints. Check your Flask server.";
            console.error(error);
        }
    }

    loadComplaints();
</script>
