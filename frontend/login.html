<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eaf0ff, #f7f8fc);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(25, 45, 90, 0.12);
    }

    .logo {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        background: #e9efff;
        color: #3159c9;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        color: #203154;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #78839a;
        font-size: 14px;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 19px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #34415b;
    }

    input, select {
        display: block;
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dce2ed;
        border-radius: 9px;
        background: white;
        color: #26344e;
        font-size: 15px;
    }

    input:focus, select:focus {
        border-color: #3159c9;
        outline: 2px solid #e9efff;
    }

    .login-button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #3159c9;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button:hover {
        background: #2446a7;
    }

    .login-button:disabled {
        opacity: 0.7;
        cursor: wait;
    }

    .message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .back-link {
        display: block;
        margin-top: 23px;
        text-align: center;
        text-decoration: none;
        color: #3159c9;
        font-size: 14px;
    }

    .footer {
        margin-top: 25px;
        text-align: center;
        font-size: 12px;
        color: #929bad;
    }
</style>
```

</head>

<body>

<main class="container">

```
<div class="logo">🏠</div>

<h1>SmartHostel</h1>

<p class="subtitle">
    Welcome back!<br>
    Sign in to access your hostel dashboard.
</p>

<form id="loginForm">

    <div class="form-group">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >
    </div>

    <div class="form-group">
        <label for="role">Login as</label>
        <select id="role" name="role" required>
            <option value="student">Student</option>
            <option value="admin">Administrator</option>
            <option value="staff">Maintenance Staff</option>
        </select>
    </div>

    <button type="submit" class="login-button" id="loginButton">
        Sign In
    </button>

    <p id="message" class="message" role="alert"></p>

</form>

<a href="/" class="back-link">← Back to Home</a>

<div class="footer">
    © 2026 SmartHostel | Hostel Management System
</div>
```

</main>

<script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.textContent = "";
        message.style.color = "#c62828";
        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    role: role
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                message.textContent =
                    data.message || "Login failed. Please try again.";
                return;
            }

            message.style.color = "green";
            message.textContent = "Login successful! Redirecting...";

            window.location.href = data.redirect;

        } catch (error) {
            message.textContent =
                "Cannot connect to the server. Make sure Flask is running.";
            console.error("Login error:", error);
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Sign In";
        }
    });
</script>

</body>
</html>
