<body>

<header>
    <h2>🏠 SmartHostel</h2>
    <a href="/">Home</a>
</header>

<main>
    <h1>Hostel Complaints</h1>

```
<p class="muted">
    Report maintenance problems to help improve hostel facilities.
</p>

<section class="card">
    <h2>Submit a Complaint</h2>

    <form id="complaintForm">
        <label for="title">Complaint Title</label>
        <input
            type="text"
            id="title"
            required
            maxlength="120"
            placeholder="Example: Broken bathroom tap"
        >

        <label for="location">Location</label>
        <input
            type="text"
            id="location"
            required
            maxlength="200"
            placeholder="Example: Block A, Room 105"
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            required
            maxlength="2000"
            placeholder="Describe the problem..."
        ></textarea>

        <label for="imageUrl">Image URL (optional)</label>
        <input
            type="url"
            id="imageUrl"
            placeholder="https://example.com/image.jpg"
        >

        <button type="submit" id="submitButton">
            Submit Complaint
        </button>

        <p class="message" id="message" role="status"></p>
    </form>
</section>

<section class="card">
    <h2>Submitted Complaints</h2>
    <div id="complaintList" class="muted">Loading complaints...</div>
</section>
```

</main>

<script>
    const form = document.getElementById("complaintForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.textContent = "";
        submitButton.disabled = true;

        const complaint = {
            title: document.getElementById("title").value.trim(),
            location: document.getElementById("location").value.trim(),
            description: document.getElementById("description").value.trim(),
            image_url: document.getElementById("imageUrl").value.trim()
        };

        try {
            const response = await fetch("/api/complaints", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(complaint)
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Complaint submission failed.");
            }

            message.style.color = "green";
            message.textContent = data.message;

            form.reset();

            await loadComplaints();

        } catch (error) {
            message.style.color = "#c62828";
            message.textContent = error.message;
            console.error(error);
        } finally {
            submitButton.disabled = false;
        }
    });

    async function loadComplaints() {
        const list = document.getElementById("complaintList");

        try {
            const response = await fetch("/api/complaints");

            if (!response.ok) {
                throw new Error("Unable to load complaints.");
            }

            const complaints = await response.json();

            list.replaceChildren();

            if (complaints.length === 0) {
                list.textContent = "No complaints submitted yet.";
                return;
            }

            for (const complaint of complaints) {
                const card = document.createElement("article");
                card.className = "complaint";

                const heading = document.createElement("h3");
                heading.textContent =
                    "#" + complaint.id + " — " + complaint.title;

                const location = document.createElement("p");
                location.textContent = "Location: " + complaint.location;

                const description = document.createElement("p");
                description.textContent = complaint.description;

                const status = document.createElement("p");
                status.className = "status";
                status.textContent = "Status: " + complaint.status;

                const date = document.createElement("p");
                date.className = "muted";
                date.textContent = "Submitted: " + complaint.created_at;

                card.append(heading, location, description, status, date);

                if (complaint.image_url) {
                    const link = document.createElement("a");
                    link.href = complaint.image_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "View attached image";
                    card.appendChild(link);
                }

                list.appendChild(card);
            }

        } catch (error) {
            list.textContent = "Could not load complaints. Check your server.";
            console.error(error);
        }
    }

    loadComplaints();
</script>
