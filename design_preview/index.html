ert thresholds", "Room-level", "Administrator", "Configured"], ["Database backup", "Daily local backup", "System", "Healthy"]]]};const icons={overview:'▦',students:'♙',rooms:'▤',mess:'◷',payments:'₹',water:'◉',electricity:'ϟ',complaints:'▣',outpasses:'↗',alerts:'⚠',reports:'▥',staff:'♧',studenthome:'⌂',studentmess:'◷',studentutilities:'ϟ',studentrequests:'▣',notices:'♢',settings:'⚙',login:'↗'};
function pill(s){let x=s.toLowerCase();let cls=(x.includes('critical')||x.includes('overdue')||x.includes('due')||x.includes('unread'))?'bad':(x.includes('pending')||x.includes('investigat')||x.includes('partial')||x.includes('stale')||x.includes('review'))?'warn':(x.includes('progress')||x.includes('assigned')||x.includes('approved'))?'info':'';return `<span class="pill ${cls}">${s}</span>`}
function tableHTML(id){let r=rows[id];if(!r)return '';return `<section class="panel"><div class="phead"><div><h2>${r[0]}</h2><p>Latest records · sample data for visual review</p></div><button class="btn">Export CSV ↓</button></div><div class="filters"><input class="filter" placeholder="Search records…"><select class="filter"><option>All statuses</option><option>Pending</option><option>In progress</option><option>Resolved</option></select><select class="filter"><option>All blocks</option><option>Block A</option><option>Block B</option><option>Block C</option></select><button class="btn primary">＋ New record</button></div><div class="tablewrap"><table><thead><tr>${r[1].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r[2].map(row=>`<tr>${row.map((cell,i)=>`<td>${i===row.length-1?pill(cell):cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function chart(id){if(id==='water'||id==='electricity'||id==='reports'||id==='studentutilities')return `<section class="panel"><div class="phead"><div><h2>${id==='water'?'Water consumption trend':id==='electricity'?'Electricity usage trend':id==='reports'?'Monthly operations trend':'Your room usage'}</h2><p>Daily totals · illustrative data</p></div><select class="filter"><option>Last 7 days</option><option>Last 30 days</option></select></div><div style="height:175px;display:flex;align-items:end;gap:12px;padding:12px 12px 0;border-bottom:1px solid var(--line)">${[44,63,51,78,59,88,72,94,65,80,58,73,91,67].map((v,i)=>`<div title="Sample reading" style="flex:1;height:${v}%;background:linear-gradient(180deg,#65e4f0aa,#8c83f555);border:1px solid #6ce4ef22;border-radius:5px 5px 0 0"></div>`).join('')}</div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:10px"><span>18 Oct</span><span>20 Oct</span><span>22 Oct</span><span>24 Oct</span></div><p class="hint">Illustrative values only. Water/electricity readings are not physical live measurements unless real meters are connected.</p></section>`;return ''}
function extra(id){if(id==='overview'||id==='studenthome')return `<div class="grid2"><section class="panel"><div class="phead"><div><h2>${id==='overview'?'Room occupancy':'Your daily checklist'}</h2><p>${id==='overview'?'Capacity overview by block and room':'Useful updates for today'}</p></div><a class="link">View all →</a></div>${id==='overview'?['A-101|3|3','A-102|1|2','B-204|2|3','C-203|0|2'].map(x=>{let a=x.split('|');return `<div class="roomline"><div class="roomico">▤</div><div class="roomtext"><strong>${a[0]}</strong><small>Block ${a[0][0]} · Room capacity</small></div><div><div class="progress"><span style="width:${100*Number(a[1])/Number(a[2])}%"></span></div><small style="color:var(--muted);font-size:9px">${a[1]} / ${a[2]} beds</small></div></div>`}).join(''):`<div class="notice"><div class="noticeicon">◷</div><div><b>Today's breakfast</b><p>Idli, sambar and fruit · Served 7:30–9:00 AM</p></div></div><div class="notice"><div class="noticeicon">▣</div><div><b>Bathroom tap complaint</b><p>Maintenance team is working on complaint CMP-104.</p></div></div><div class="notice"><div class="noticeicon">↗</div><div><b>Upcoming outpass</b><p>Approved for Saturday · Remember to record departure at the gate.</p></div></div>`}</section><section class="panel"><div class="phead"><div><h2>Quick actions</h2><p>Frequently used tools</p></div></div><div class="quick"><div class="tile"><span class="badgeicon cyan">＋</span><b>${id==='overview'?'Add student':'Report a problem'}</b><small>Open a guided form</small></div><div class="tile"><span class="badgeicon violet">▤</span><b>${id==='overview'?'Allocate room':'View room details'}</b><small>Room & bed records</small></div><div class="tile"><span class="badgeicon amber">↗</span><b>${id==='overview'?'Review outpasses':'Apply for outpass'}</b><small>Request status</small></div><div class="tile"><span class="badgeicon pink">♢</span><b>Notices</b><small>Latest hostel updates</small></div></div></section></div>`;
if(id==='water'||id==='electricity')return `<div class="grid2">${chart(id)}<section class="panel"><div class="phead"><div><h2>Threshold configuration</h2><p>Per meter · admin-only controls</p></div></div><div class="formgrid"><div class="field"><label>Warning threshold</label><input value="300 ${id==='water'?'L/day':'kWh/day'}"></div><div class="field"><label>Critical threshold</label><input value="500 ${id==='water'?'L/day':'kWh/day'}"></div><div class="field wide"><label>Reading source</label><select><option>Manual / simulated</option><option>Connected IoT device</option></select></div></div><p class="hint">Changes should be saved with authorization and an audit record. Demo readings are clearly labelled.</p><button class="btn primary">Save thresholds</button></section></div>`;
if(id==='mess'||id==='studentmess')return `<section class="panel"><div class="phead"><div><h2>Today's meals</h2><p>Published menu · example schedule</p></div>${id==='mess'?'<button class="btn primary">＋ Add menu item</button>':''}</div><div class="quick"><div class="tile"><span class="badgeicon amber">☀</span><b>Breakfast · 7:30–9:00</b><small>Idli, sambar, fruit and tea</small></div><div class="tile"><span class="badgeicon cyan">◉</span><b>Lunch · 12:30–2:00</b><small>Rice, dal, vegetables and curd</small></div><div class="tile"><span class="badgeicon violet">☕</span><b>Evening snacks · 4:30–5:30</b><small>Seasonal snack and tea</small></div><div class="tile"><span class="badgeicon pink">☾</span><b>Dinner · 7:30–9:00</b><small>Chapati, paneer curry and salad</small></div></div></section>${id==='studentmess'?'<section class="panel"><div class="phead"><div><h2>Rate today’s meal</h2><p>Feedback helps improve the menu</p></div></div><div style="font-size:25px;color:var(--amber);letter-spacing:7px">☆ ☆ ☆ ☆ ☆</div><div class="field" style="margin:14px 0"><label>Your feedback</label><textarea rows="3" placeholder="Share a suggestion with the mess manager…"></textarea></div><button class="btn primary">Submit feedback</button></section>':''}`;
if(id==='complaints'||id==='studentrequests')return `<section class="panel"><div class="phead"><div><h2>${id==='complaints'?'Assign and track a complaint':'Submit a new complaint'}</h2><p>${id==='complaints'?'Clear ownership, priority and resolution notes':'Tell the hostel team what needs attention'}</p></div></div><div class="formgrid"><div class="field"><label>Category</label><select><option>Plumbing / water</option><option>Electricity</option><option>Cleaning</option><option>Wi-Fi / internet</option></select></div><div class="field"><label>Priority</label><select><option>Normal</option><option>High</option><option>Critical</option></select></div><div class="field"><label>${id==='complaints'?'Assigned staff':'Room'}</label><select><option>${id==='complaints'?'Select staff member':'B-204'}</option><option>Maintenance team</option></select></div><div class="field"><label>Expected response</label><select><option>Within 24 hours</option><option>Immediate</option><option>Within 3 days</option></select></div><div class="field wide"><label>Description</label><textarea rows="3" placeholder="Describe the issue clearly…"></textarea></div></div><p class="hint">For emergencies, contact hostel staff directly. Submitting this form does not replace emergency support.</p><button class="btn primary">${id==='complaints'?'Save assignment':'Submit complaint'}</button></section>`;
if(id==='outpasses')return `<section class="panel"><div class="phead"><div><h2>Outpass workflow</h2><p>Approval and actual movement are recorded separately.</p></div><button class="btn primary">＋ New request</button></div><div class="grid2"><div class="tile"><b>Approval status</b><small>Pending · Approved · Rejected</small><p class="hint">Warden records the decision and any rejection reason.</p></div><div class="tile"><b>Gate movement log</b><small>Departure and return timestamps</small><p class="hint">An approved request alone does not prove departure or return.</p></div></div></section>`;
if(id==='alerts')return `<div class="filters"><select class="filter"><option>All categories</option><option>Water</option><option>Electricity</option><option>Maintenance</option></select><select class="filter"><option>All severities</option><option>Critical</option><option>High</option></select><select class="filter"><option>All statuses</option><option>New</option><option>Investigating</option><option>Resolved</option></select><button class="btn">Export CSV ↓</button></div><section class="panel"><div class="phead"><div><h2>Alert handling checklist</h2><p>Acknowledge, assign, investigate, and record resolution notes.</p></div></div><div class="notice"><div class="noticeicon" style="color:var(--pink)">⚠</div><div><b>Critical alert requires investigation</b><p>Water usage exceeded the configured threshold for Block A · A-101.</p></div><button class="btn">Assign</button></div><div class="notice"><div class="noticeicon" style="color:var(--amber)">ϟ</div><div><b>Meter data is stale</b><p>Block C · C-203 has not reported a new reading for 18 hours.</p></div><button class="btn">Investigate</button></div></section>`;
if(id==='reports')return `${chart(id)}<section class="panel"><div class="phead"><div><h2>Export report</h2><p>Export only the records your role is authorized to access.</p></div></div><div class="formgrid"><div class="field"><label>Report type</label><select><option>Monthly hostel summary</option><option>Complaints</option><option>Room occupancy</option><option>Payments</option><option>Utility consumption</option></select></div><div class="field"><label>Date range</label><select><option>October 2026</option><option>Last 30 days</option><option>Custom range</option></select></div></div><p class="hint">Utility costs are estimates based on configured tariffs, not official bills.</p><button class="btn primary">Download CSV</button></section>`;
if(id==='staff'||id==='settings')return `<section class="panel"><div class="phead"><div><h2>${id==='staff'?'Role permissions':'System configuration'}</h2><p>Changes require administrator authorization and should be audit logged.</p></div><button class="btn primary">＋ ${id==='staff'?'Add staff':'Add configuration'}</button></div><div class="quick">${(id==='staff'?[['Administrator','System settings, users and global utility configuration'],['Warden','Students, room allocation, complaints and outpasses'],['Accountant','Mess billing and payment records'],['Maintenance','Assigned complaints only']]:[['Hostel details','Name, blocks, capacity and contact information'],['Utility tariffs','Versioned water and electricity rates'],['Alert thresholds','Room-level warning and critical limits'],['Data protection','Backups, retention and access controls']]).map((a,i)=>`<div class="tile"><span class="badgeicon ${['cyan','violet','amber','pink'][i]}">${i+1}</span><b>${a[0]}</b><small>${a[1]}</small></div>`).join('')}</div></section>`;
if(id==='notices')return `<section class="panel"><div class="phead"><div><h2>Important updates</h2><p>Published announcements and targeted notifications</p></div><button class="btn primary">＋ New notice</button></div><div class="notice"><div class="noticeicon">◉</div><div><b>Water maintenance · Block B</b><p>Supply interruption expected between 2:00 PM and 3:00 PM today.</p></div>${pill('Unread')}</div><div class="notice"><div class="noticeicon">◷</div><div><b>Friday dinner menu revised</b><p>The dinner menu has been updated. Please check the mess page.</p></div>${pill('Unread')}</div><div class="notice"><div class="noticeicon">♢</div><div><b>Weekend gate timings</b><p>Review the updated hostel gate timings before planning an outing.</p></div>${pill('Read')}</div></section>`;
if(id==='students')return `<section class="panel"><div class="phead"><div><h2>Student record actions</h2><p>Protect personal details and preserve change history.</p></div><button class="btn primary">＋ Add student</button></div><p class="hint">Room assignment changes should update bed availability atomically. Student accounts can view only their own private records.</p></section>`;
if(id==='studentutilities')return chart(id);
return ''}
function render(){let id=window.__forcedPage||new URLSearchParams(location.search).get('page')||location.hash.replace('#','')||'overview';if(!data[id])id='overview';const p=pages.find(x=>x[0]===id);document.getElementById('crumb').textContent='SMART HOSTEL / '+p[3];document.getElementById('topTitle').textContent=p[2];document.getElementById('who').textContent=p[3]==='STUDENT'?'Ananya Rao':p[3]==='AUTHENTICATION'?'Guest session':'Admin Workspace';document.getElementById('role').textContent=p[3];document.getElementById('nav').innerHTML=pages.filter(x=>x[0]!=='login').map(x=>`<a href="?page=${x[0]}" class="${x[0]===id?'active':''}"><span class="ico">${icons[x[0]]}</span>${x[1]}</a>`).join('');let d=data[id];if(id==='login'){document.getElementById('content').innerHTML=`<div class="loginwrap"><div class="loginbox"><div class="mark">S</div><div class="eyebrow" style="margin-top:20px">SMART HOSTEL PORTAL</div><h1>Welcome back</h1><p>Sign in to manage your hostel life or continue your administrator workspace.</p><div class="field"><label>Username or student ID</label><input placeholder="Enter your username"></div><div class="field"><label>Password</label><input type="password" placeholder="Enter your password"></div><button class="btn primary" style="width:100%;margin-top:8px">Sign in →</button><p class="hint">Student registration is separate from administrator provisioning. Never deploy demo credentials.</p></div></div>`;return}let stats=d[2].map(s=>`<div class="card"><div class="stathead"><span>${s[0]}</span><span class="badgeicon ${s[4]}">${s[3]}</span></div><div class="number">${s[1]}</div><div class="label">${s[2].split('|')[0]}</div><div class="foot">${s[2].includes('|')?s[2].split('|')[1]:'Sample operational indicator'}</div></div>`).join('');let title=d[0],sub=d[1];document.getElementById('content').innerHTML=`<div class="welcome"><div><div class="eyebrow">${p[3]} WORKSPACE <span style="color:var(--cyan);margin-left:8px">● VISUAL PREVIEW</span></div><h1>${title}</h1><p>${sub}</p></div><button class="btn primary">${id==='studenthome'?'View notices':id==='login'?'Sign in':'＋ Quick action'}</button></div>${stats?`<div class="stats">${stats}</div>`:''}${extra(id)}${tableHTML(id)}<div class="footer">© 2026 SmartHostel <span>· UI concept with illustrative data · live readings require connected systems</span></div>`}
render();
</script></body></html>
